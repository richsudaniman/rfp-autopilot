# Drop a questionnaire into inbox/ and push: this workflow drafts the answers
# and attaches the answered spreadsheet to the run as a downloadable artifact.
# Add an ANTHROPIC_API_KEY repository secret to use LLM drafting; without it
# the run falls back to offline mode (best approved answer, verbatim).
name: Answer questionnaires

on:
  push:
    paths: ["inbox/**.xlsx"]
  workflow_dispatch:

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Draft answers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p answered
          shopt -s nullglob
          files=(inbox/*.xlsx)
          if [ ${#files[@]} -eq 0 ]; then echo "No questionnaires in inbox/"; exit 0; fi
          for f in "${files[@]}"; do
            name=$(basename "$f" .xlsx)
            python -m rfp_autopilot "$f" -o "answered/${name}_answered.xlsx" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: answered-questionnaires
          path: answered/
          if-no-files-found: ignore

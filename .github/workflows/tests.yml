name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Smoke test on the sample questionnaire (offline)
        run: python -m rfp_autopilot examples/sample_questionnaire.xlsx --offline -o /tmp/out.xlsx
